<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outreach: Create Event</title>
    <style>
      body {
        margin: 10px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      .page {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        padding-top: 50px;
      }
      .column {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .column input[type="text"],
      .column textarea {
        width: 100%;
        max-width: 400px;
        font-size: 1.1rem;
        padding: 6px;
        box-sizing: border-box;
      }
      textarea {
        resize: none;
      }
      button {
        font-size: 1.1rem;
        padding: 6px 16px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="column">
        <label for="cover-image">Cover Image:</label>
        <input id="cover-image" type="file" accept="image/*" />
        <img
          src="Assets/PlaceholderEventImage.jpg"
          alt="Place Holder Event Image"
        />
      </div>
      <div class="column">
        <label for="name-input">Enter Event Information:</label>
        <input id="name-input" type="text" placeholder="Enter event name:" />
        <input type="text" placeholder="Enter Estimated Date:" />
        <input type="text" placeholder="Enter Location:" />
        <textarea rows="5" placeholder="Short Description:"></textarea>
        <input type="text" placeholder="How many people are you looking for?" />
        <input type="text" placeholder="Tags:" />
        <button onclick="window.location.href = 'home.html'">Submit</button>
      </div>
    </div>
  </body>
</html>
