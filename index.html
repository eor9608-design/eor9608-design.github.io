<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outreach: Login</title>
  </head>
  <body style="padding: 0; margin: 0; height: 100vh">
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 50vh;
      "
    >
      <img src="Assets/outreachFullLogo.png" alt="Outreach Full Logo" />
      <br />

      <div style="display: inline-flex; flex-direction: column">
        <label for="email-input" style="margin-bottom: 4px">Sign up:</label>
        <input
          id="email-input"
          type="text"
          placeholder="Enter Email"
          style="text-align: center"
        />
      </div>

      <br />
      <input
        type="password"
        placeholder="Enter Password"
        style="text-align: center"
      />
      <br />
      <button onclick="window.location.href = 'home.html'">Sign Up</button>
      <p>Already have an account? <a href="home.html">Log in</a></p>
    </div>
  </body>
</html>
